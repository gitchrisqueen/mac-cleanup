name: Bug
description: Something behaves incorrectly
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: mac-cleanup --version
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version (sw_vers -productVersion) and architecture (uname -m)
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
